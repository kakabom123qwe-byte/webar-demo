<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >
  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>AR — Дмитрий Рогозин</title>

  <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", Arial, sans-serif;
    }

    a-scene {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      background: transparent !important;
      z-index: 2;
    }

    canvas.a-canvas {
      background: transparent !important;
    }

    body video:not(#personVideo) {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
      opacity: 1 !important;
      visibility: visible !important;
      display: block !important;
      z-index: 0 !important;
      pointer-events: none !important;
    }

    #personVideo {
      position: fixed !important;
      left: -5px !important;
      top: -5px !important;
      width: 2px !important;
      height: 2px !important;
      opacity: 0.01 !important;
      pointer-events: none !important;
      z-index: -1 !important;
    }

    #hint {
      position: fixed;
      z-index: 1000;
      left: 50%;
      bottom: calc(22px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      width: max-content;
      max-width: calc(100vw - 60px);
      padding: 11px 17px;
      border-radius: 18px;
      background: rgba(0, 0, 0, 0.48);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: white;
      font-size: 14px;
      text-align: center;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    #sound {
      position: fixed;
      z-index: 1100;
      top: calc(16px + env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      border: 0;
      border-radius: 18px;
      padding: 12px 18px;
      background: rgba(255, 255, 255, 0.94);
      color: #111;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 5px 22px rgba(0, 0, 0, 0.18);
      cursor: pointer;
    }

    #startup {
      position: fixed;
      inset: 0;
      z-index: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    #startupBox {
      padding: 14px 20px;
      border-radius: 20px;
      background: rgba(0, 0, 0, 0.48);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      color: white;
      font-size: 15px;
    }
  </style>

  <script>
    // Видео: слева цветное изображение, справа маска прозрачности.
    AFRAME.registerComponent("alpha-video", {
      schema: {
        src: { type: "selector" }
      },

      init: function () {
        const THREE = AFRAME.THREE;
        const video = this.data.src;

        this.texture = new THREE.VideoTexture(video);
        this.texture.minFilter = THREE.LinearFilter;
        this.texture.magFilter = THREE.LinearFilter;
        this.texture.generateMipmaps = false;

        this.material = new THREE.ShaderMaterial({
          uniforms: {
            map: { value: this.texture }
          },

          vertexShader: `
            varying vec2 vUv;

            void main() {
              vUv = uv;
              gl_Position = projectionMatrix
                * modelViewMatrix
                * vec4(position, 1.0);
            }
          `,

          fragmentShader: `
            precision mediump float;

            uniform sampler2D map;
            varying vec2 vUv;

            void main() {
              vec2 rgbUV = vec2(vUv.x * 0.5, vUv.y);
              vec2 maskUV = vec2(
                0.5 + vUv.x * 0.5,
                vUv.y
              );

              vec3 rgb = texture2D(map, rgbUV).rgb;
              float mask = texture2D(map, maskUV).r;
              float alpha = smoothstep(0.10, 0.58, mask);

              if (alpha < 0.02) discard;

              gl_FragColor = vec4(rgb, alpha);
            }
          `,

          transparent: true,
          depthWrite: false,
          depthTest: true,
          side: THREE.DoubleSide
        });

        this.applyMaterial = () => {
          const mesh = this.el.getObject3D("mesh");

          if (mesh) {
            mesh.material = this.material;
          }
        };

        this.applyMaterial();
        this.el.addEventListener("object3dset", this.applyMaterial);
      },

      remove: function () {
        this.el.removeEventListener("object3dset", this.applyMaterial);
        if (this.texture) this.texture.dispose();
        if (this.material) this.material.dispose();
      }
    });
  </script>
</head>

<body>
  <div id="startup">
    <div id="startupBox">Запускаем AR…</div>
  </div>

  <button id="sound" type="button">🔊 Включить звук</button>

  <div id="hint" role="status">
    Разрешите доступ к камере
  </div>

  <a-scene
    mindar-image="
     imageTargetSrc: ./assets/target.mind?v=4;
      autoStart: true;
    "
    color-space="sRGB"
    renderer="
      colorManagement: true;
      alpha: true;
      antialias: true;
    "
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    loading-screen="enabled: false"
    embedded
  >
    <a-assets timeout="30000">
      <video
        id="personVideo"
        src="./assets/person_packed.mp4"
        preload="auto"
        playsinline
        webkit-playsinline
        crossorigin="anonymous"
        loop
        muted
      ></video>
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    ></a-camera>

    <a-entity
      id="target"
      mindar-image-target="targetIndex: 0"
    >
      <a-plane
        id="person"
        width="0.675"
        height="1.20"
        position="0 0.60 0.035"
        rotation="0 0 0"
        scale="0.01 0.01 0.01"
        alpha-video="src: #personVideo"
      ></a-plane>
    </a-entity>
  </a-scene>

  <script>
    const scene = document.querySelector("a-scene");
    const video = document.querySelector("#personVideo");
    const target = document.querySelector("#target");
    const person = document.querySelector("#person");
    const hint = document.querySelector("#hint");
    const sound = document.querySelector("#sound");
    const startup = document.querySelector("#startup");

    let targetVisible = false;
    let hintTimer;

    function showHint(message) {
      clearTimeout(hintTimer);
      hint.textContent = message;
      hint.style.opacity = "1";
    }

    function hideHintLater() {
      clearTimeout(hintTimer);
      hintTimer = setTimeout(() => {
        if (targetVisible && !video.paused) {
          hint.style.opacity = "0";
        }
      }, 1500);
    }

    scene.addEventListener("arReady", () => {
      startup.style.display = "none";
      showHint("Наведите камеру на карточку");
    });

    scene.addEventListener("arError", () => {
      startup.style.display = "none";
      showHint(
        "Не удалось запустить камеру. Проверьте разрешение в браузере."
      );
    });

    video.addEventListener("error", () => {
      startup.style.display = "none";
      showHint(
        "Видео не загрузилось. Проверьте файл assets/person_packed.mp4"
      );
    });

    sound.addEventListener("click", async () => {
      sound.disabled = true;

      try {
        video.muted = false;
        await video.play();

        if (!targetVisible) {
          video.pause();
          video.currentTime = 0;
        } else {
          hideHintLater();
        }

        sound.style.display = "none";
      } catch (error) {
        video.muted = true;
        showHint("Нажмите кнопку звука ещё раз");
        console.error("Не удалось включить звук:", error);
      } finally {
        sound.disabled = false;
      }
    });

    target.addEventListener("targetFound", async () => {
      targetVisible = true;
      showHint("Карточка найдена");

      person.removeAttribute("animation__appear");
      person.setAttribute("animation__appear", {
        property: "scale",
        from: "0.01 0.01 0.01",
        to: "1 1 1",
        dur: 380,
        easing: "easeOutBack"
      });

      try {
        video.currentTime = 0;
        await video.play();

        if (!targetVisible) {
          video.pause();
          return;
        }

        hideHintLater();
      } catch (error) {
        if (!targetVisible) return;

        sound.style.display = "block";
        sound.textContent = "▶ Запустить видео со звуком";
        showHint("Нажмите кнопку сверху для запуска видео");
        console.error("Не удалось запустить видео:", error);
      }
    });

    target.addEventListener("targetLost", () => {
      targetVisible = false;
      video.pause();

      person.removeAttribute("animation__appear");
      person.setAttribute("scale", "0.01 0.01 0.01");

      showHint("Наведите камеру на карточку");
    });
  </script>
</body>
</html>
