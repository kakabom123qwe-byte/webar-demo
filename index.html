<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <title>AR Experience</title>

  <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0d1110 !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    #loader {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(
          circle at 50% 45%,
          #23362e 0%,
          #15221c 42%,
          #0b100d 78%
        );
      color: white;
      transition: opacity .35s ease;
    }

    #loader.hide {
      opacity: 0;
      pointer-events: none;
    }

    .loader-content {
      width: 80%;
      max-width: 320px;
      text-align: center;
    }

    .ar-logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 20px;
      border: 1px solid rgba(157, 212, 177, .5);
      background: rgba(157, 212, 177, .08);
      color: #b8dfc6;
      font-size: 25px;
      font-weight: 700;
      box-shadow: 0 0 30px rgba(91, 168, 119, .14);
    }

    .loader-title {
      font-size: 22px;
      font-weight: 600;
    }

    .loader-subtitle {
      margin-top: 8px;
      color: rgba(255,255,255,.6);
      font-size: 14px;
    }

    .loader-spinner {
      width: 34px;
      height: 34px;
      margin: 26px auto 0;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,.12);
      border-top-color: #9dd4b1;
      animation: rotateLoader .8s linear infinite;
    }

    @keyframes rotateLoader {
      to {
        transform: rotate(360deg);
      }
    }

    a-scene {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      background: transparent !important;
      z-index: 2;
    }

    canvas.a-canvas {
      background: transparent !important;
    }

    body video:not(#personVideo) {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
      opacity: 1 !important;
      visibility: visible !important;
      z-index: 0 !important;
      pointer-events: none !important;
    }

    #personVideo {
      position: fixed !important;
      left: -5px !important;
      top: -5px !important;
      width: 2px !important;
      height: 2px !important;
      opacity: 0.01 !important;
      pointer-events: none !important;
      z-index: -1 !important;
    }

    #hint {
      position: fixed;
      z-index: 1000;
      left: 50%;
      bottom: calc(24px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      max-width: 85%;
      padding: 11px 17px;
      border-radius: 16px;
      background: rgba(10,16,12,.68);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: white;
      font-size: 14px;
      text-align: center;
      white-space: nowrap;
      opacity: 0;
      transition: opacity .3s ease;
      pointer-events: none;
    }

    #hint.show {
      opacity: 1;
    }

    #sound {
      display: none;
      position: fixed;
      z-index: 1100;
      top: calc(16px + env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 18px;
      border: none;
      border-radius: 16px;
      background: rgba(255,255,255,.96);
      color: #111;
      font-size: 15px;
      font-weight: 650;
      box-shadow: 0 5px 20px rgba(0,0,0,.18);
    }
  </style>

  <script>
    AFRAME.registerComponent("alpha-video", {
      schema: {
        src: {
          type: "selector"
        }
      },

      init: function () {

        const video = this.data.src;
        const texture = new THREE.VideoTexture(video);

        texture.minFilter = THREE.LinearFilter;
        texture.magFilter = THREE.LinearFilter;
        texture.generateMipmaps = false;

        const material = new THREE.ShaderMaterial({

          uniforms: {
            map: {
              value: texture
            }
          },

          vertexShader: `
            varying vec2 vUv;

            void main() {
              vUv = uv;

              gl_Position =
                projectionMatrix *
                modelViewMatrix *
                vec4(position, 1.0);
            }
          `,

          fragmentShader: `
            precision mediump float;

            uniform sampler2D map;
            varying vec2 vUv;

            void main() {

              vec2 rgbUV =
                vec2(
                  vUv.x * 0.5,
                  vUv.y
                );

              vec2 maskUV =
                vec2(
                  0.5 + vUv.x * 0.5,
                  vUv.y
                );

              vec4 rgb =
                texture2D(
                  map,
                  rgbUV
                );

              float mask =
                texture2D(
                  map,
                  maskUV
                ).r;

              float alpha =
                smoothstep(
                  0.10,
                  0.58,
                  mask
                );

              if (alpha < 0.02) {
                discard;
              }

              gl_FragColor =
                vec4(
                  rgb.rgb,
                  alpha
                );
            }
          `,

          transparent: true,
          depthWrite: false,
          depthTest: true,
          side: THREE.DoubleSide
        });

        const applyMaterial = () => {

          const mesh =
            this.el.getObject3D("mesh");

          if (!mesh) {
            return;
          }

          mesh.material = material;
          mesh.material.needsUpdate = true;
        };

        applyMaterial();

        this.el.addEventListener(
          "object3dset",
          applyMaterial
        );
      }
    });


    /*
    ==========================================
    3D-ОРИЕНТАЦИЯ

    QR / карточка = пол
    Z = вверх от поверхности карточки

    Человек стоит ногами в feetAnchor
    и поворачивается лицом к камере.
    ==========================================
    */

    AFRAME.registerComponent("table-billboard", {

      init: function () {

        this.cameraWorld =
          new THREE.Vector3();

        this.cameraLocal =
          new THREE.Vector3();

        this.forward =
          new THREE.Vector3();

        this.right =
          new THREE.Vector3();

        this.up =
          new THREE.Vector3(
            0,
            0,
            1
          );

        this.matrix =
          new THREE.Matrix4();

        this.quaternion =
          new THREE.Quaternion();
      },

      tick: function () {

        const cameraEl =
          document.querySelector(
            "a-camera"
          );

        const targetEl =
          document.querySelector(
            "#target"
          );

        if (!cameraEl || !targetEl) {
          return;
        }

        const object =
          this.el.object3D;

        const targetObject =
          targetEl.object3D;

        /*
        Получаем камеру
        в координатах карточки.
        */

        cameraEl.object3D.getWorldPosition(
          this.cameraWorld
        );

        this.cameraLocal.copy(
          this.cameraWorld
        );

        targetObject.worldToLocal(
          this.cameraLocal
        );

        /*
        Направление от QR
        к телефону.

        Z = 0,
        чтобы человек
        только вращался вокруг ног,
        а не наклонялся.
        */

        this.forward.set(
          this.cameraLocal.x -
          object.position.x,

          this.cameraLocal.y -
          object.position.y,

          0
        );

        if (
          this.forward.lengthSq() <
          0.000001
        ) {
          return;
        }

        this.forward.normalize();

        /*
        Правая ось человека.
        */

        this.right
          .crossVectors(
            this.up,
            this.forward
          )
          .normalize();

        /*
        X = вправо
        Y = вверх
        Z = к камере
        */

        this.matrix.makeBasis(
          this.right,
          this.up,
          this.forward
        );

        this.quaternion
          .setFromRotationMatrix(
            this.matrix
          );

        object.quaternion.copy(
          this.quaternion
        );
      }
    });
  </script>
</head>

<body>

  <div id="loader">

    <div class="loader-content">

      <div class="ar-logo">
        AR
      </div>

      <div class="loader-title">
        Дополненная реальность
      </div>

      <div
        class="loader-subtitle"
        id="loaderText"
      >
        Запускаем камеру…
      </div>

      <div class="loader-spinner"></div>

    </div>

  </div>


  <button id="sound">
    🔊 Включить звук
  </button>


  <div id="hint">
    Наведите камеру на карточку
  </div>


  <a-scene

    mindar-image="
      imageTargetSrc: ./assets/target.mind;
      autoStart: true;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true;
      alpha: true;
      antialias: true;
    "

    vr-mode-ui="
      enabled: false
    "

    device-orientation-permission-ui="
      enabled: false
    "

    loading-screen="
      enabled: false
    "

    embedded
  >

    <a-assets timeout="10000">

      <video
        id="personVideo"
        src="./assets/person_alpha.webm"
        preload="metadata"
        playsinline
        webkit-playsinline
        crossorigin="anonymous"
        loop
        muted
      ></video>

    </a-assets>


    <a-camera

      position="0 0 0"

      look-controls="
        enabled: false
      "

    ></a-camera>


    <a-entity

      id="target"

      mindar-image-target="
        targetIndex: 0
      "

    >

      <!--
      ==============================
      ЦЕНТР QR / ТОЧКА НОГ

      X = -0.23
      Y = -0.235

      Если после теста будет
      чуть не по центру,
      будем менять только эти
      две цифры.
      ==============================
      -->

      <a-entity

        id="feetAnchor"

        position="
          -0.23
          -0.235
          0.01
        "

        table-billboard

      >

        <!--
        ==============================
        ФИГУРА

        width  = 0.22
        height = 0.39

        Y = половина высоты,
        поэтому стопы находятся
        в точке feetAnchor.
        ==============================
        -->

        <a-plane

          id="person"

          width="
            0.22
          "

          height="
            0.39
          "

          position="
            0
            0.195
            0
          "

          alpha-video="
            src: #personVideo
          "

        ></a-plane>


        <!--
        Мягкая тень под ногами.
        Помогает визуально
        "поставить" человека
        на поверхность.
        -->

        <a-circle

          radius="0.07"

          position="
            0
            0
            -0.002
          "

          rotation="
            90
            0
            0
          "

          material="
            color: #000000;
            transparent: true;
            opacity: 0.16;
            depthWrite: false;
          "

          scale="
            1
            0.32
            1
          "

        ></a-circle>

      </a-entity>


    </a-entity>


  </a-scene>


  <script>

    const scene =
      document.querySelector(
        "a-scene"
      );

    const video =
      document.querySelector(
        "#personVideo"
      );

    const target =
      document.querySelector(
        "#target"
      );

    const hint =
      document.querySelector(
        "#hint"
      );

    const sound =
      document.querySelector(
        "#sound"
      );

    const loader =
      document.querySelector(
        "#loader"
      );

    const loaderText =
      document.querySelector(
        "#loaderText"
      );


    scene.addEventListener(
      "arReady",
      () => {

        loaderText.textContent =
          "Камера готова";

        setTimeout(
          () => {

            loader.classList.add(
              "hide"
            );

            setTimeout(
              () => {

                loader.style.display =
                  "none";

              },
              400
            );

          },
          250
        );

        hint.classList.add(
          "show"
        );

        sound.style.display =
          "block";
      }
    );


    scene.addEventListener(
      "arError",
      () => {

        loaderText.textContent =
          "Не удалось запустить камеру";

      }
    );


    sound.addEventListener(
      "click",
      async () => {

        try {

          video.muted = false;

          await video.play();

          video.pause();

          video.currentTime = 0;

          sound.style.display =
            "none";

        }

        catch (error) {

          console.log(
            "Audio error:",
            error
          );

        }
      }
    );


    target.addEventListener(
      "targetFound",
      async () => {

        hint.textContent =
          "Карточка найдена";

        if (
          video.readyState < 2
        ) {
          video.load();
        }

        video.currentTime = 0;

        try {

          await video.play();

        }

        catch (error) {

          console.log(
            "Video error:",
            error
          );

        }
      }
    );


    target.addEventListener(
      "targetLost",
      () => {

        video.pause();

        hint.textContent =
          "Наведите камеру на карточку";

      }
    );

  </script>

</body>
</html>
