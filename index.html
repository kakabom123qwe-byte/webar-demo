<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>AR — Дмитрий Рогозин</title>

  <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      font-family: Arial, sans-serif;
    }

    a-scene {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      background: transparent !important;
      z-index: 2;
    }

    canvas.a-canvas {
      background: transparent !important;
    }

    /* Видео камеры, которое создаёт MindAR */
    body video:not(#personVideo) {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
      opacity: 1 !important;
      visibility: visible !important;
      z-index: 0 !important;
      pointer-events: none !important;
    }

    /* Не прячем display:none — iOS может остановить видео */
    #personVideo {
      position: fixed !important;
      left: -4px !important;
      top: -4px !important;
      width: 2px !important;
      height: 2px !important;
      opacity: 0.01 !important;
      pointer-events: none !important;
      z-index: -1 !important;
    }

    #hint {
      position: fixed;
      z-index: 1000;
      left: 50%;
      bottom: calc(22px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      padding: 11px 16px;
      border-radius: 14px;
      background: rgba(0,0,0,.55);
      color: #fff;
      font-size: 14px;
      text-align: center;
      white-space: nowrap;
      pointer-events: none;
    }

    #sound {
      position: fixed;
      z-index: 1100;
      top: calc(16px + env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 18px;
      border: 0;
      border-radius: 14px;
      background: #fff;
      color: #000;
      font-size: 15px;
      font-weight: 700;
      box-shadow: 0 4px 18px rgba(0,0,0,.18);
    }

    #browserWarning {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 5000;
      background: rgba(0,0,0,.92);
      color: white;
      padding: 28px;
      box-sizing: border-box;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    #browserWarning .box {
      max-width: 380px;
    }

    #browserWarning h2 {
      margin: 0 0 12px;
      font-size: 24px;
    }

    #browserWarning p {
      margin: 0;
      line-height: 1.45;
      opacity: .85;
      font-size: 16px;
    }
  </style>

  <script>
    AFRAME.registerComponent("alpha-video", {
      schema: { src: { type: "selector" } },

      init: function () {
        const video = this.data.src;
        const texture = new THREE.VideoTexture(video);

        texture.minFilter = THREE.LinearFilter;
        texture.magFilter = THREE.LinearFilter;
        texture.generateMipmaps = false;

        const material = new THREE.ShaderMaterial({
          uniforms: {
            map: { value: texture }
          },

          vertexShader: `
            varying vec2 vUv;
            void main() {
              vUv = uv;
              gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
          `,

          fragmentShader: `
            precision mediump float;
            uniform sampler2D map;
            varying vec2 vUv;

            void main() {
              // person_alpha.webm:
              // левая половина = RGB, правая = grayscale alpha-mask
              vec2 rgbUV  = vec2(vUv.x * 0.5, vUv.y);
              vec2 maskUV = vec2(0.5 + vUv.x * 0.5, vUv.y);

              vec4 rgb = texture2D(map, rgbUV);
              float mask = texture2D(map, maskUV).r;

              float alpha = smoothstep(0.10, 0.58, mask);

              if (alpha < 0.02) discard;

              gl_FragColor = vec4(rgb.rgb, alpha);
            }
          `,

          transparent: true,
          depthWrite: false,
          depthTest: true,
          side: THREE.DoubleSide
        });

        const apply = () => {
          const mesh = this.el.getObject3D("mesh");
          if (!mesh) return;
          mesh.material = material;
          mesh.material.needsUpdate = true;
        };

        apply();
        this.el.addEventListener("object3dset", apply);
      }
    });
  </script>
</head>

<body>

  <div id="browserWarning">
    <div class="box">
      <h2>Откройте в Safari</h2>
      <p>
        Сейчас страница открыта во встроенном браузере приложения.
        Для корректной AR-камеры откройте эту страницу в Safari.
      </p>
    </div>
  </div>

  <button id="sound">🔊 Включить звук</button>
  <div id="hint">Разрешите доступ к камере</div>

  <a-scene
    mindar-image="imageTargetSrc: ./assets/target.mind; autoStart: true;"
    color-space="sRGB"
    renderer="colorManagement: true; alpha: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    loading-screen="enabled: true"
    embedded
  >
    <a-assets timeout="30000">
      <video
        id="personVideo"
        src="./assets/person_alpha.webm"
        preload="auto"
        playsinline
        webkit-playsinline
        crossorigin="anonymous"
        loop
        muted
      ></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="target" mindar-image-target="targetIndex: 0">
      <a-plane
        id="person"
        width="0.65"
        height="1.15"
        position="0 0.575 0"
        alpha-video="src: #personVideo"
      ></a-plane>
    </a-entity>
  </a-scene>

  <script>
    const scene = document.querySelector("a-scene");
    const video = document.querySelector("#personVideo");
    const target = document.querySelector("#target");
    const hint = document.querySelector("#hint");
    const sound = document.querySelector("#sound");
    const warning = document.querySelector("#browserWarning");

    // Встроенные браузеры соцсетей часто ломают WebAR-камеру на iPhone.
    const ua = navigator.userAgent || "";
    const inAppBrowser = /VK|Instagram|FBAN|FBAV|Telegram/i.test(ua);
    if (inAppBrowser) {
      warning.style.display = "flex";
    }

    scene.addEventListener("arReady", () => {
      hint.textContent = "Наведите камеру на карточку";
    });

    scene.addEventListener("arError", () => {
      hint.textContent = "Не удалось запустить камеру";
    });

    sound.addEventListener("click", async () => {
      try {
        video.muted = false;
        await video.play();
        video.pause();
        video.currentTime = 0;
        sound.style.display = "none";
      } catch (e) {
        console.log("Audio unlock error:", e);
      }
    });

    target.addEventListener("targetFound", async () => {
      hint.textContent = "Карточка найдена";
      video.currentTime = 0;

      try {
        await video.play();
      } catch (e) {
        console.log("Video play error:", e);
      }
    });

    target.addEventListener("targetLost", () => {
      video.pause();
      hint.textContent = "Наведите камеру на карточку";
    });
  </script>
</body>
</html>
