<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>AR — Дмитрий Рогозин</title>

  <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", Arial, sans-serif;
    }

    a-scene {
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      background: transparent !important;
      z-index: 2;
    }

    canvas.a-canvas {
      background: transparent !important;
    }

    body > video {
      pointer-events: none;
    }

    #personVideo {
      position: fixed !important;
      left: -5px !important;
      top: -5px !important;
      width: 2px !important;
      height: 2px !important;
      opacity: 0.01 !important;
      pointer-events: none !important;
      z-index: -1 !important;
    }

    #hint {
      position: fixed;
      z-index: 1000;
      left: 50%;
      bottom: calc(22px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      box-sizing: border-box;
      width: max-content;
      max-width: calc(100vw - 32px);
      padding: 12px 18px;
      border-radius: 18px;
      background: rgba(0, 0, 0, 0.58);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: white;
      font-size: 14px;
      line-height: 1.4;
      text-align: center;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    #sound {
      position: fixed;
      z-index: 1100;
      top: calc(16px + env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      max-width: calc(100vw - 32px);
      border: 0;
      border-radius: 18px;
      padding: 13px 20px;
      background: rgba(255, 255, 255, 0.96);
      color: #111;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 5px 22px rgba(0, 0, 0, 0.18);
      cursor: pointer;
    }

    #sound:disabled {
      opacity: 0.65;
    }

    #startup {
      position: fixed;
      inset: 0;
      z-index: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    #startupBox {
      max-width: 280px;
      margin: 20px;
      padding: 16px 22px;
      border-radius: 20px;
      background: rgba(0, 0, 0, 0.58);
      color: white;
      font-size: 15px;
      text-align: center;
      line-height: 1.5;
    }
  </style>

  <script>
    // Человек поворачивается к камере вокруг точки у стоп.
    AFRAME.registerComponent("face-viewer", {
      init: function () {
        this.cameraPosition = new AFRAME.THREE.Vector3();
      },

      tick: function () {
        const anchor = this.el.parentEl.object3D;
        const camera = this.el.sceneEl.camera;

        if (!camera || !anchor.visible) return;

        anchor.updateWorldMatrix(true, false);

        const determinant = anchor.matrixWorld.determinant();

        if (
          !Number.isFinite(determinant) ||
          Math.abs(determinant) < 1e-8
        ) return;

        camera.getWorldPosition(this.cameraPosition);
        anchor.worldToLocal(this.cameraPosition);

        const dx =
          this.cameraPosition.x - this.el.object3D.position.x;
        const dy =
          this.cameraPosition.y - this.el.object3D.position.y;

        if (dx * dx + dy * dy < 0.0025) return;

        this.el.object3D.rotation.z =
          Math.atan2(dy, dx) + Math.PI / 2;
      }
    });

    // Центрирование модели и установка основания на поверхность.
    AFRAME.registerComponent("ground-model", {
      schema: {
        diameter: { default: 0.36 }
      },

      init: function () {
        this.loaded = () => {
          const THREE = AFRAME.THREE;
          const mesh = this.el.getObject3D("mesh");

          if (!mesh) return;

          const parent = mesh.parent;

          parent.remove(mesh);
          mesh.updateMatrixWorld(true);

          const box = new THREE.Box3().setFromObject(mesh);
          const size = box.getSize(new THREE.Vector3());
          const center = box.getCenter(new THREE.Vector3());
          const span = Math.hypot(size.x, size.z);

          if (!Number.isFinite(span) || span <= 0) {
            parent.add(mesh);
            this.el.emit("model-error", {
              message: "Invalid model bounds"
            });
            return;
          }

          const scale = this.data.diameter / span;

          mesh.scale.multiplyScalar(scale);
          mesh.position.set(
            -center.x * scale,
            -box.min.y * scale,
            -center.z * scale
          );

          parent.add(mesh);
          mesh.updateMatrixWorld(true);
        };

        this.el.addEventListener("model-loaded", this.loaded);
      },

      remove: function () {
        this.el.removeEventListener("model-loaded", this.loaded);
      }
    });

    // Медленное вращение генератора.
    AFRAME.registerComponent("gentle-spin", {
      tick: function (time, delta) {
        if (
          !document.hidden &&
          document.querySelector("#target").object3D.visible
        ) {
          this.el.object3D.rotation.y +=
            Math.min(delta || 0, 50) * Math.PI / 20000;
        }
      }
    });

    // В person_packed.mp4 слева находится цвет, справа — маска.
    AFRAME.registerComponent("alpha-video", {
      schema: {
        src: { type: "selector" }
      },

      init: function () {
        const THREE = AFRAME.THREE;
        const video = this.data.src;

        this.texture = new THREE.VideoTexture(video);
        this.texture.minFilter = THREE.LinearFilter;
        this.texture.magFilter = THREE.LinearFilter;
        this.texture.generateMipmaps = false;

        this.material = new THREE.ShaderMaterial({
          uniforms: {
            videoMap: { value: this.texture }
          },

          vertexShader: `
            varying vec2 vUv;

            void main() {
              vUv = uv;
              gl_Position = projectionMatrix
                * modelViewMatrix
                * vec4(position, 1.0);
            }
          `,

          fragmentShader: `
            precision highp float;

            uniform sampler2D videoMap;
            varying vec2 vUv;

            void main() {
              float x = clamp(vUv.x, 0.001, 0.999);

              vec2 rgbUV = vec2(x * 0.5, vUv.y);
              vec2 maskUV = vec2(0.5 + x * 0.5, vUv.y);

              vec3 rgb = texture2D(videoMap, rgbUV).rgb;
              float mask = texture2D(videoMap, maskUV).r;

              float alpha = smoothstep(0.08, 0.85, mask);

              if (alpha < 0.02) discard;

              vec3 color = clamp(
                rgb / max(mask, 0.08),
                0.0,
                1.0
              );

              gl_FragColor = vec4(color, alpha);
            }
          `,

          transparent: true,
          depthWrite: false,
          depthTest: true,
          side: THREE.DoubleSide
        });

        this.applyMaterial = () => {
          const mesh = this.el.getObject3D("mesh");

          if (mesh) {
            mesh.material = this.material;
            mesh.renderOrder = 2;
          }
        };

        this.applyMaterial();
        this.el.addEventListener("object3dset", this.applyMaterial);
      },

      remove: function () {
        this.el.removeEventListener(
          "object3dset",
          this.applyMaterial
        );

        if (this.texture) this.texture.dispose();
        if (this.material) this.material.dispose();
      }
    });

    // Мягкие декоративные тени на открытке.
    AFRAME.registerComponent("soft-shadow", {
      init: function () {
        const THREE = AFRAME.THREE;

        this.material = new THREE.ShaderMaterial({
          vertexShader: `
            varying vec2 vUv;

            void main() {
              vUv = uv;
              gl_Position = projectionMatrix
                * modelViewMatrix
                * vec4(position, 1.0);
            }
          `,

          fragmentShader: `
            precision mediump float;
            varying vec2 vUv;

            void main() {
              vec2 p = (vUv - 0.5) * 2.0;
              float distanceFromCenter = length(p);
              float opacity = 1.0 - smoothstep(
                0.05,
                1.0,
                distanceFromCenter
              );

              opacity = opacity * opacity * 0.26;

              if (opacity < 0.002) discard;

              gl_FragColor = vec4(0.0, 0.0, 0.0, opacity);
            }
          `,

          transparent: true,
          depthWrite: false,
          side: THREE.DoubleSide
        });

        this.applyMaterial = () => {
          const mesh = this.el.getObject3D("mesh");

          if (mesh) {
            mesh.material = this.material;
            mesh.renderOrder = 1;
          }
        };

        this.applyMaterial();
        this.el.addEventListener("object3dset", this.applyMaterial);
      },

      remove: function () {
        this.el.removeEventListener(
          "object3dset",
          this.applyMaterial
        );

        if (this.material) this.material.dispose();
      }
    });
  </script>
</head>

<body>
  <div id="startup">
    <div id="startupBox">
      Запускаем AR…<br>
      Разрешите доступ к камере
    </div>
  </div>

  <button id="sound" type="button">
    🔊 Включить звук
  </button>

  <div id="hint" role="status">
    Положите открытку на стол и держите её целиком в кадре
  </div>

  <a-scene
    mindar-image="
      imageTargetSrc: ./assets/target.mind?card=1;
      autoStart: true;
      maxTrack: 1;
      filterMinCF: 0.001;
      filterBeta: 1000;
      warmupTolerance: 8;
      missTolerance: 3;
      uiScanning: no;
    "
    color-space="sRGB"
    renderer="
      colorManagement: true;
      alpha: true;
      antialias: true;
    "
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    loading-screen="enabled: false"
    embedded
  >
    <a-assets timeout="30000">
      <video
        id="personVideo"
        src="./assets/person_packed.mp4"
        preload="auto"
        playsinline
        webkit-playsinline
        crossorigin="anonymous"
        loop
        muted
      ></video>
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
      wasd-controls="enabled: false"
    ></a-camera>

    <a-entity
      light="type: ambient; color: #ffffff; intensity: 0.85"
    ></a-entity>

    <a-entity
      light="type: directional; color: #fff4e6; intensity: 1.6"
      position="1 2 2"
    ></a-entity>

    <a-entity
      light="type: directional; color: #dbeaff; intensity: 0.65"
      position="-2 1 0"
    ></a-entity>

    <a-entity
      id="target"
      mindar-image-target="targetIndex: 0"
    >
      <a-plane
        width="0.24"
        height="0.14"
        position="-0.316667 -0.023810 0.002"
        rotation="0 0 0"
        soft-shadow
      ></a-plane>

      <!-- Человек слева над QR. -->
      <a-entity
        id="personPivot"
        position="-0.316667 -0.023810 0.003"
        face-viewer
      >
        <a-plane
          id="person"
          width="0.50625"
          height="0.90"
          position="-0.010125 0 0.3825"
          rotation="90 0 0"
          alpha-video="src: #personVideo"
        ></a-plane>
      </a-entity>

      <!-- Генератор справа на поверхности открытки. -->
      <a-plane
        width="0.39"
        height="0.32"
        position="0.22 -0.023810 0.002"
        soft-shadow
      ></a-plane>

      <a-entity
        position="0.22 -0.023810 0.003"
        rotation="90 0 0"
      >
        <a-entity gentle-spin rotation="0 20 0">
          <a-entity
            id="generator"
            ground-model="diameter: 0.36"
            gltf-model="url(./assets/generator.glb)"
          ></a-entity>
        </a-entity>
      </a-entity>
    </a-entity>
  </a-scene>

  <script>
    const scene = document.querySelector("a-scene");
    const video = document.querySelector("#personVideo");
    const target = document.querySelector("#target");
    const hint = document.querySelector("#hint");
    const sound = document.querySelector("#sound");
    const startup = document.querySelector("#startup");

    let targetVisible = false;
    let hintTimer = null;
    let soundEnabled = false;
    let soundBusy = false;
    let playbackAttempt = 0;
    let playPending = false;
    let videoFailed = false;

    function showHint(message) {
      clearTimeout(hintTimer);
      hint.textContent = message;
      hint.style.opacity = "1";
    }

    function hideHintLater() {
      clearTimeout(hintTimer);

      hintTimer = setTimeout(() => {
        if (targetVisible && !video.paused && !videoFailed) {
          hint.style.opacity = "0";
        }
      }, 1800);
    }

    function showPlayButton() {
      sound.style.display = "block";
      sound.textContent = soundEnabled
        ? "▶ Продолжить видео"
        : "▶ Запустить видео со звуком";
    }

    async function playTrackedVideo() {
      if (
        !targetVisible ||
        document.hidden ||
        soundBusy ||
        playPending ||
        videoFailed
      ) return;

      const attempt = ++playbackAttempt;
      playPending = true;

      try {
        await video.play();

        if (!targetVisible || document.hidden) {
          video.pause();
          return;
        }

        if (soundEnabled) {
          sound.style.display = "none";
        }

        hideHintLater();
      } catch (error) {
        if (
          attempt !== playbackAttempt ||
          !targetVisible
        ) return;

        showPlayButton();
        showHint("Нажмите кнопку сверху, чтобы запустить видео");
        console.error("Ошибка воспроизведения:", error);
      } finally {
        playPending = false;

        if (
          attempt !== playbackAttempt &&
          targetVisible &&
          !document.hidden &&
          !soundBusy &&
          !videoFailed
        ) {
          playTrackedVideo();
        }
      }
    }

    scene.addEventListener("arReady", () => {
      startup.style.display = "none";
      showHint(
        "Наведите камеру на всю горизонтальную панель открытки"
      );
    });

    scene.addEventListener("arError", () => {
      startup.style.display = "none";
      showHint(
        "Не удалось запустить AR. Проверьте доступ к камере и обновите страницу."
      );
    });

    video.addEventListener("error", () => {
      videoFailed = true;
      startup.style.display = "none";
      showHint(
        "Видео не загрузилось. Проверьте интернет и обновите страницу."
      );
    });

    video.addEventListener("waiting", () => {
      if (targetVisible) {
        showHint("Загружаем видео…");
      }
    });

    video.addEventListener("playing", () => {
      if (targetVisible) {
        hideHintLater();
      }
    });

    sound.addEventListener("click", async () => {
      if (soundBusy) return;

      soundBusy = true;
      sound.disabled = true;
      ++playbackAttempt;

      try {
        video.muted = false;
        await video.play();
        soundEnabled = true;

        if (!targetVisible || document.hidden) {
          video.pause();
        } else {
          hideHintLater();
        }

        sound.style.display = "none";
      } catch (error) {
        video.muted = true;
        soundEnabled = false;
        showPlayButton();
        showHint(
          "Не удалось включить звук. Нажмите кнопку ещё раз."
        );
        console.error("Ошибка включения звука:", error);
      } finally {
        soundBusy = false;
        sound.disabled = false;
      }
    });

    target.addEventListener("targetFound", () => {
      targetVisible = true;
      showHint("Открытка найдена");
      playTrackedVideo();
    });

    target.addEventListener("targetLost", () => {
      targetVisible = false;
      ++playbackAttempt;
      video.pause();
      showHint("Верните всю открытку в кадр");
    });

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        ++playbackAttempt;
        video.pause();
      } else if (targetVisible) {
        playTrackedVideo();
      }
    });

    window.addEventListener("pagehide", () => {
      ++playbackAttempt;
      video.pause();
    });

    document.querySelector("#generator").addEventListener(
      "model-error",
      () => {
        showHint(
          "Генератор не загрузился. Проверьте файл assets/generator.glb"
        );
      }
    );
  </script>
</body>
</html>
