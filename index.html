<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,user-scalable=no"
  >

  <title>AR — Дмитрий Рогозин</title>

  <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #hint {
      position: fixed;
      z-index: 1000;
      left: 50%;
      bottom: 25px;
      transform: translateX(-50%);
      padding: 12px 18px;
      border-radius: 14px;
      background: rgba(0,0,0,.55);
      color: #fff;
      font-size: 14px;
      text-align: center;
      pointer-events: none;
      white-space: nowrap;
    }

    #sound {
      position: fixed;
      z-index: 1100;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 18px;
      border: 0;
      border-radius: 14px;
      background: #fff;
      color: #000;
      font-size: 14px;
      font-weight: 700;
    }
  </style>

  <script>

    AFRAME.registerComponent("transparent-video", {

      schema: {
        src: { type: "selector" }
      },

      init: function () {

        const video = this.data.src;

        const texture = new THREE.VideoTexture(video);

        texture.minFilter = THREE.LinearFilter;
        texture.magFilter = THREE.LinearFilter;
        texture.generateMipmaps = false;

        const material = new THREE.ShaderMaterial({

          uniforms: {
            map: { value: texture }
          },

          vertexShader: `

            varying vec2 vUv;

            void main() {

              vUv = uv;

              gl_Position =
                projectionMatrix *
                modelViewMatrix *
                vec4(position, 1.0);

            }

          `,

          fragmentShader: `

            precision mediump float;

            uniform sampler2D map;

            varying vec2 vUv;

            void main() {

              /*
              person_alpha.webm:
              левая половина = изображение человека
              правая половина = alpha mask
              */

              vec2 rgbUV =
                vec2(
                  vUv.x * 0.5,
                  vUv.y
                );

              vec2 maskUV =
                vec2(
                  0.5 + vUv.x * 0.5,
                  vUv.y
                );

              vec4 rgb =
                texture2D(
                  map,
                  rgbUV
                );

              float mask =
                texture2D(
                  map,
                  maskUV
                ).r;


              /*
              Делаем фон полностью прозрачным
              */

              float alpha =
                smoothstep(
                  0.18,
                  0.60,
                  mask
                );


              if (alpha < 0.03) {
                discard;
              }


              /*
              Дополнительно убираем почти чёрные
              пиксели по краям
              */

              float brightness =
                max(
                  rgb.r,
                  max(rgb.g, rgb.b)
                );

              if (
                brightness < 0.025 &&
                alpha < 0.65
              ) {
                discard;
              }


              gl_FragColor =
                vec4(
                  rgb.rgb,
                  alpha
                );

            }

          `,

          transparent: true,
          depthWrite: false,
          side: THREE.DoubleSide

        });


        const applyMaterial = () => {

          const mesh =
            this.el.getObject3D("mesh");

          if (mesh) {

            mesh.material = material;
            mesh.material.needsUpdate = true;

          }

        };


        applyMaterial();

        this.el.addEventListener(
          "object3dset",
          applyMaterial
        );

      }

    });

  </script>

</head>

<body>


  <button id="sound">
    🔊 Включить звук
  </button>


  <div id="hint">
    Разрешите камеру
  </div>


  <a-scene

    mindar-image="
      imageTargetSrc: ./assets/target.mind;
      autoStart: true;
    "

    renderer="
      colorManagement: true;
      alpha: true;
    "

    color-space="sRGB"

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"

    loading-screen="enabled: true"

  >


    <a-assets>

      <video
        id="personVideo"
        src="./assets/person_alpha.webm"
        preload="auto"
        playsinline
        webkit-playsinline
        crossorigin="anonymous"
        loop
        muted
      ></video>

    </a-assets>


    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    ></a-camera>


    <a-entity
      id="target"
      mindar-image-target="targetIndex: 0"
    >

      <a-plane
        id="person"
        width="0.65"
        height="1.15"
        position="0 0.575 0"
        transparent-video="src: #personVideo"
      ></a-plane>

    </a-entity>


  </a-scene>


  <script>

    const video =
      document.querySelector("#personVideo");

    const target =
      document.querySelector("#target");

    const hint =
      document.querySelector("#hint");

    const sound =
      document.querySelector("#sound");

    const scene =
      document.querySelector("a-scene");


    /*
    Камера успешно запущена
    */

    scene.addEventListener(
      "arReady",
      () => {

        hint.innerText =
          "Наведите камеру на карточку";

      }
    );


    /*
    Ошибка камеры
    */

    scene.addEventListener(
      "arError",
      () => {

        hint.innerText =
          "Не удалось получить доступ к камере";

      }
    );


    /*
    Разблокировка звука
    */

    sound.addEventListener(
      "click",
      async () => {

        try {

          video.muted = false;

          await video.play();

          video.pause();

          video.currentTime = 0;

          sound.style.display =
            "none";

        }

        catch (e) {

          console.log(e);

        }

      }
    );


    /*
    Нашли карточку
    */

    target.addEventListener(
      "targetFound",
      async () => {

        hint.innerText =
          "Карточка найдена";

        video.currentTime = 0;

        try {

          await video.play();

        }

        catch (e) {

          console.log(e);

        }

      }
    );


    /*
    Потеряли карточку
    */

    target.addEventListener(
      "targetLost",
      () => {

        video.pause();

        hint.innerText =
          "Наведите камеру на карточку";

      }
    );

  </script>


</body>
</html>
