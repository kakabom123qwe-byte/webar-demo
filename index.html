<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <title>AR Experience</title>

  <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0d1110 !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    #loader {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(
          circle at 50% 45%,
          #23362e 0%,
          #15221c 42%,
          #0b100d 78%
        );

      color: white;
      transition: opacity .35s ease;
    }

    #loader.hide {
      opacity: 0;
      pointer-events: none;
    }

    .loader-content {
      width: 80%;
      max-width: 320px;
      text-align: center;
    }

    .ar-logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 24px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 20px;
      border: 1px solid rgba(157, 212, 177, .5);

      background: rgba(157, 212, 177, .08);
      color: #b8dfc6;

      font-size: 25px;
      font-weight: 700;

      box-shadow: 0 0 30px rgba(91, 168, 119, .14);
    }

    .loader-title {
      font-size: 22px;
      font-weight: 600;
    }

    .loader-subtitle {
      margin-top: 8px;
      color: rgba(255,255,255,.6);
      font-size: 14px;
    }

    .loader-spinner {
      width: 34px;
      height: 34px;
      margin: 26px auto 0;

      border-radius: 50%;
      border: 2px solid rgba(255,255,255,.12);
      border-top-color: #9dd4b1;

      animation: rotateLoader .8s linear infinite;
    }

    @keyframes rotateLoader {
      to {
        transform: rotate(360deg);
      }
    }

    a-scene {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;

      background: transparent !important;

      z-index: 2;
    }

    canvas.a-canvas {
      background: transparent !important;
    }

    body video:not(#personVideo) {
      position: fixed !important;
      inset: 0 !important;

      width: 100vw !important;
      height: 100vh !important;

      object-fit: cover !important;

      opacity: 1 !important;
      visibility: visible !important;

      z-index: 0 !important;

      pointer-events: none !important;
    }

    #personVideo {
      position: fixed !important;

      left: -5px !important;
      top: -5px !important;

      width: 2px !important;
      height: 2px !important;

      opacity: 0.01 !important;

      pointer-events: none !important;

      z-index: -1 !important;
    }

    #hint {
      position: fixed;

      z-index: 1000;

      left: 50%;

      bottom:
        calc(
          24px +
          env(safe-area-inset-bottom)
        );

      transform: translateX(-50%);

      max-width: 85%;

      padding: 11px 17px;

      border-radius: 16px;

      background: rgba(10,16,12,.68);

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      color: white;

      font-size: 14px;

      text-align: center;

      white-space: nowrap;

      opacity: 0;

      transition: opacity .3s ease;

      pointer-events: none;
    }

    #hint.show {
      opacity: 1;
    }

    #sound {
      display: none;

      position: fixed;

      z-index: 1100;

      top:
        calc(
          16px +
          env(safe-area-inset-top)
        );

      left: 50%;

      transform: translateX(-50%);

      padding: 12px 18px;

      border: none;

      border-radius: 16px;

      background: rgba(255,255,255,.96);

      color: #111;

      font-size: 15px;
      font-weight: 650;

      box-shadow: 0 5px 20px rgba(0,0,0,.18);
    }
  </style>

  <script>
    /*
    ======================================================
    ПРОЗРАЧНОЕ ВИДЕО
    person_alpha.webm:
    слева RGB
    справа alpha-mask
    ======================================================
    */

    AFRAME.registerComponent("alpha-video", {
      schema: {
        src: {
          type: "selector"
        }
      },

      init: function () {
        const video = this.data.src;

        const texture =
          new THREE.VideoTexture(video);

        texture.minFilter =
          THREE.LinearFilter;

        texture.magFilter =
          THREE.LinearFilter;

        texture.generateMipmaps =
          false;

        const material =
          new THREE.ShaderMaterial({
            uniforms: {
              map: {
                value: texture
              }
            },

            vertexShader: `
              varying vec2 vUv;

              void main() {
                vUv = uv;

                gl_Position =
                  projectionMatrix *
                  modelViewMatrix *
                  vec4(position, 1.0);
              }
            `,

            fragmentShader: `
              precision mediump float;

              uniform sampler2D map;

              varying vec2 vUv;

              void main() {

                vec2 rgbUV =
                  vec2(
                    vUv.x * 0.5,
                    vUv.y
                  );

                vec2 maskUV =
                  vec2(
                    0.5 + vUv.x * 0.5,
                    vUv.y
                  );

                vec4 rgb =
                  texture2D(
                    map,
                    rgbUV
                  );

                float mask =
                  texture2D(
                    map,
                    maskUV
                  ).r;

                float alpha =
                  smoothstep(
                    0.10,
                    0.58,
                    mask
                  );

                if (
                  alpha < 0.02
                ) {
                  discard;
                }

                gl_FragColor =
                  vec4(
                    rgb.rgb,
                    alpha
                  );
              }
            `,

            transparent: true,

            depthWrite: false,

            depthTest: true,

            side: THREE.DoubleSide
          });

        const applyMaterial = () => {
          const mesh =
            this.el.getObject3D("mesh");

          if (!mesh) {
            return;
          }

          mesh.material =
            material;

          mesh.material.needsUpdate =
            true;
        };

        applyMaterial();

        this.el.addEventListener(
          "object3dset",
          applyMaterial
        );
      }
    });





    /*
    ======================================================
    BILLBOARD ДЛЯ ЛЕЖАЩЕЙ КАРТОЧКИ

    Фигура:
    - стоит вертикально;
    - ногами на QR;
    - поворачивается лицом к камере.
    ======================================================
    */

    AFRAME.registerComponent(
      "table-billboard",
      {

        tick: function () {

          const cameraEl =
            document.querySelector(
              "a-camera"
            );

          if (!cameraEl) {
            return;
          }

          const object =
            this.el.object3D;

          const parent =
            object.parent;

          if (!parent) {
            return;
          }

          const cameraWorld =
            new THREE.Vector3();

          cameraEl.object3D.getWorldPosition(
            cameraWorld
          );

          const anchorWorld =
            new THREE.Vector3();

          object.getWorldPosition(
            anchorWorld
          );

          /*
          Используем ориентацию мира,
          а не наклон карточки.
          */

          const up =
            new THREE.Vector3(
              0,
              1,
              0
            );

          const forward =
            new THREE.Vector3().subVectors(
              cameraWorld,
              anchorWorld
            );

          /*
          Фигура не заваливается
          в сторону камеры.
          */

          forward.y = 0;

          if (
            forward.lengthSq() < 0.000001
          ) {
            return;
          }

          forward.normalize();

          const right =
            new THREE.Vector3()
              .crossVectors(
                up,
                forward
              )
              .normalize();

          const correctedForward =
            new THREE.Vector3()
              .crossVectors(
                right,
                up
              )
              .normalize();

          const matrix =
            new THREE.Matrix4();

          matrix.makeBasis(
            right,
            up,
            correctedForward
          );

          const desiredWorldQuaternion =
            new THREE.Quaternion();

          desiredWorldQuaternion.setFromRotationMatrix(
            matrix
          );

          const parentWorldQuaternion =
            new THREE.Quaternion();

          parent.getWorldQuaternion(
            parentWorldQuaternion
          );

          parentWorldQuaternion.invert();

          const localQuaternion =
            parentWorldQuaternion.multiply(
              desiredWorldQuaternion
            );

          object.quaternion.copy(
            localQuaternion
          );
        }
      }
    );
  </script>
</head>

<body>

  <div id="loader">

    <div class="loader-content">

      <div class="ar-logo">
        AR
      </div>

      <div class="loader-title">
        Дополненная реальность
      </div>

      <div
        class="loader-subtitle"
        id="loaderText"
      >
        Запускаем камеру…
      </div>

      <div class="loader-spinner"></div>

    </div>

  </div>



  <button id="sound">
    🔊 Включить звук
  </button>



  <div id="hint">
    Наведите камеру на карточку
  </div>



  <a-scene

    mindar-image="
      imageTargetSrc: ./assets/target.mind;
      autoStart: true;
    "

    color-space="
      sRGB
    "

    renderer="
      colorManagement: true;
      alpha: true;
    "

    vr-mode-ui="
      enabled: false
    "

    device-orientation-permission-ui="
      enabled: false
    "

    loading-screen="
      enabled: false
    "

    embedded

  >



    <a-assets timeout="10000">

      <video

        id="personVideo"

        src="./assets/person_alpha.webm"

        preload="metadata"

        playsinline

        webkit-playsinline

        crossorigin="anonymous"

        loop

        muted

      ></video>

    </a-assets>



    <a-camera

      position="
        0 0 0
      "

      look-controls="
        enabled: false
      "

    ></a-camera>



    <a-entity

      id="target"

      mindar-image-target="
        targetIndex: 0
      "

    >



      <!--
      ====================================================
      ТОЧКА НОГ

      Сейчас QR предполагается
      ПО ЦЕНТРУ target.

      Поэтому:
      X = 0
      Y = 0

      Z = 0.02
      небольшой отступ от поверхности.

      Именно сюда "приклеены" стопы.
      ====================================================
      -->


      <a-entity

        id="feetAnchor"

        position="
          0
          0
          0.02
        "

        table-billboard

      >



        <!--
        ==================================================
        ФИГУРА

        Ширина уменьшена,
        чтобы визуально помещаться
        на небольшом QR.

        width = 0.28
        height = 0.50

        Половина height:
        0.50 / 2 = 0.25

        Поэтому нижняя граница
        фигуры совпадает с feetAnchor.
        ==================================================
        -->


        <a-plane

          id="person"

          width="
            0.28
          "

          height="
            0.50
          "

          position="
            0
            0.25
            0
          "

          alpha-video="
            src: #personVideo
          "

        ></a-plane>



      </a-entity>



    </a-entity>



  </a-scene>



  <script>

    const scene =
      document.querySelector(
        "a-scene"
      );

    const video =
      document.querySelector(
        "#personVideo"
      );

    const target =
      document.querySelector(
        "#target"
      );

    const hint =
      document.querySelector(
        "#hint"
      );

    const sound =
      document.querySelector(
        "#sound"
      );

    const loader =
      document.querySelector(
        "#loader"
      );

    const loaderText =
      document.querySelector(
        "#loaderText"
      );



    scene.addEventListener(
      "arReady",
      () => {

        loaderText.textContent =
          "Камера готова";

        setTimeout(
          () => {

            loader.classList.add(
              "hide"
            );

            setTimeout(
              () => {

                loader.style.display =
                  "none";

              },
              400
            );

          },
          250
        );

        hint.classList.add(
          "show"
        );

        sound.style.display =
          "block";
      }
    );



    scene.addEventListener(
      "arError",
      () => {

        loaderText.textContent =
          "Не удалось запустить камеру";

      }
    );



    sound.addEventListener(
      "click",
      async () => {

        try {

          video.muted =
            false;

          await video.play();

          video.pause();

          video.currentTime =
            0;

          sound.style.display =
            "none";

        }

        catch (error) {

          console.log(
            "Audio error:",
            error
          );

        }
      }
    );



    target.addEventListener(
      "targetFound",
      async () => {

        hint.textContent =
          "Карточка найдена";

        if (
          video.readyState < 2
        ) {

          video.load();

        }

        video.currentTime =
          0;

        try {

          await video.play();

        }

        catch (error) {

          console.log(
            "Video error:",
            error
          );

        }
      }
    );



    target.addEventListener(
      "targetLost",
      () => {

        video.pause();

        hint.textContent =
          "Наведите камеру на карточку";

      }
    );

  </script>

</body>
</html>
